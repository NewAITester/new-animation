config:
  validation: true
  warningsAsErrors: true
complexity:
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated:
      - Composable
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    ignorePrivate: true
naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'
style:
  MagicNumber:
    active: true
    excludes:
      - '**/*.gradle.kts'
      - '**/src/test/**'
      - '**/src/androidTest/**'
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
